name: Grafana Incident to Upptime

on:
  repository_dispatch:
    types:
      - grafana_incident

permissions:
  issues: write
  contents: read

concurrency:
  group: grafana-incident-${{ github.event.client_payload.alert || 'default' }}
  cancel-in-progress: false

jobs:
  create-or-update-incident:
    runs-on: ubuntu-latest

    steps:
      - name: Create or update incident issue
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload.client_payload || {};

            const sanitizeLabel = s => String(s).replace(/[^a-z0-9-]/gi, '-').toLowerCase().slice(0, 50);
            const sanitizeSearch = s => String(s).replace(/"/g, '').trim().slice(0, 100);

            const VALID_SEVERITIES = new Set(["P0", "P1"]);

            const status      = payload.status   || "firing";
            const severity    = VALID_SEVERITIES.has(payload.severity) ? payload.severity : "P1";
            const alert       = sanitizeSearch(payload.alert   || "Grafana Alert");
            const service     = sanitizeLabel(payload.service  || "unknown-service");
            const description = sanitizeSearch(payload.description || "");

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let upptimeStatusLabel = "degraded";
            let title = `${service} has degraded performance`;

            if (severity === "P0") {
              upptimeStatusLabel = "down";
              title = `${service} is down`;
            }

            if (severity === "P1") {
              upptimeStatusLabel = "degraded";
              title = `${service} has degraded performance`;
            }

            const body = `
            ## ${severity} Incident

            **Source:** Grafana
            **Status:** ${status}
            **Alert:** ${alert}
            **Service:** ${service}

            ## Description

            ${description}

            ## Updates

            We are investigating this incident.
            `;

            const labels = ["status", upptimeStatusLabel, "incident", "grafana", severity, service];

            const searchQuery = `repo:${owner}/${repo} is:issue is:open label:grafana "${alert}" "${service}"`;

            const existing = await github.rest.search.issuesAndPullRequests({
              q: searchQuery
            });

            if (status === "resolved" || status === "ok") {
              if (existing.data.items.length > 0) {
                const issue = existing.data.items[0];

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `✅ Grafana alert resolved for **${alert}** / **${service}**.`
                });

                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: ["resolved"]
                });

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: "closed"
                });
              }

              return;
            }

            if (existing.data.items.length > 0) {
              const issue = existing.data.items[0];

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `🚨 Grafana alert is still firing.\n\n${body}`
              });

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels
              });

              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels
            });