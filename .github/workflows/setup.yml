name: Setup CI
on:
  push:
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:
jobs:
  release:
    name: Setup Upptime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_RW_TOKEN_GNOSISPAY_UPTIME || github.token }}
      - name: Update template
        uses: upptime/uptime-monitor@1b53cea83cd619c9ddb2aec18366abd00cfa060d # v1.41.3
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ secrets.GH_RW_TOKEN_GNOSISPAY_UPTIME || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@1b53cea83cd619c9ddb2aec18366abd00cfa060d # v1.41.3
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GH_RW_TOKEN_GNOSISPAY_UPTIME || github.token }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@1b53cea83cd619c9ddb2aec18366abd00cfa060d # v1.41.3
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_RW_TOKEN_GNOSISPAY_UPTIME || github.token }}
      - name: Generate graphs
        uses: benc-uk/workflow-dispatch@7a027648b88c2413826b6ddd6c76114894dc5ec4 # v1.3.1
        with:
          workflow: Graphs CI
          token: ${{ secrets.GH_RW_TOKEN_GNOSISPAY_UPTIME || github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@1b53cea83cd619c9ddb2aec18366abd00cfa060d # v1.41.3
        with:
          command: "site"
        env:
          GH_PAT: ${{ secrets.GH_RW_TOKEN_GNOSISPAY_UPTIME || github.token }}
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        name: GitHub Pages Deploy
        with:
          github_token: ${{ secrets.GH_RW_TOKEN_GNOSISPAY_UPTIME || github.token }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
